<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BrailBox Scanner - Mobile Camera OCR</title>
    
    <!-- External Dependencies & Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="css/styles.css">

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            overflow: hidden;
            height: 100%;
            height: 100dvh;
            width: 100vw;
            margin: 0;
            padding: 0;
            background: #000000;
            color: #f8fafc;
            font-family: 'Prompt', sans-serif;
            touch-action: manipulation;
        }

        /* Full-screen Mobile Camera Layout */
        .mobile-camera-root {
            position: relative;
            width: 100vw;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            background: #000;
        }

        /* Top Header Overlay */
        .mobile-top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 30;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: max(12px, env(safe-area-inset-top, 12px)) 16px 12px 16px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0.3) 70%, transparent 100%);
        }

        .mobile-nav-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 16px;
            backdrop-filter: blur(8px);
            transition: all 0.2s;
        }

        .mobile-nav-btn:active {
            transform: scale(0.92);
            background: rgba(0, 242, 254, 0.3);
        }

        /* Room Status Interactive Pill */
        .mobile-room-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid rgba(0, 242, 254, 0.4);
            border-radius: 30px;
            padding: 6px 14px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 700;
            color: #00f2fe;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5), 0 0 10px rgba(0, 242, 254, 0.2);
            backdrop-filter: blur(10px);
            cursor: pointer;
            transition: all 0.2s;
        }

        .mobile-room-pill.connected {
            border-color: rgba(0, 255, 136, 0.6);
            color: #00ff88;
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.3);
        }

        .mobile-room-pill:active {
            transform: scale(0.96);
        }

        .status-dot-pulse {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #eab308;
            box-shadow: 0 0 8px #eab308;
            animation: dotPulse 1.5s infinite alternate;
        }

        .status-dot-pulse.connected {
            background: #00ff88;
            box-shadow: 0 0 10px #00ff88;
        }

        @keyframes dotPulse {
            from { transform: scale(0.8); opacity: 0.6; }
            to { transform: scale(1.25); opacity: 1; }
        }

        /* Camera Viewport Area */
        .mobile-viewport-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        #cameraVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Viewfinder Framing Box for Book/Document */
        .mobile-viewfinder-overlay {
            position: absolute;
            width: min(88vw, 360px);
            height: min(60vh, 480px);
            border: 2px solid rgba(0, 242, 254, 0.4);
            border-radius: 18px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.55), 0 0 25px rgba(0, 242, 254, 0.3);
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px;
        }

        .frame-guide-header {
            font-size: 11px;
            color: #00f2fe;
            background: rgba(15, 23, 42, 0.75);
            padding: 4px 10px;
            border-radius: 20px;
            align-self: center;
            font-weight: 600;
            backdrop-filter: blur(4px);
            letter-spacing: 0.5px;
        }

        /* Bottom Controls Bar */
        .mobile-bottom-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 14px 20px max(24px, env(safe-area-inset-bottom, 24px)) 20px;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.5) 75%, transparent 100%);
        }

        .shutter-row {
            width: 100%;
            max-width: 360px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
        }

        /* Large Touch-friendly Shutter Button */
        .btn-shutter-main {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: #ffffff;
            border: 4px solid rgba(0, 242, 254, 0.8);
            box-shadow: 0 0 24px rgba(0, 242, 254, 0.5), inset 0 0 8px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-shutter-main:active {
            transform: scale(0.9);
            background: #00f2fe;
            box-shadow: 0 0 32px rgba(0, 255, 136, 0.8);
        }

        .shutter-inner-dot {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00f2fe, #00ff88);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #022c22;
            font-size: 22px;
        }

        .btn-control-aux {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.2s;
        }

        .btn-control-aux:active {
            transform: scale(0.92);
            background: rgba(0, 242, 254, 0.3);
            color: #00f2fe;
        }

        /* Auxiliary Pills Toolbar */
        .aux-pills-bar {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .aux-pill-btn {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #94a3b8;
            font-size: 11px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(6px);
            transition: all 0.2s;
        }

        .aux-pill-btn.active {
            background: rgba(0, 255, 136, 0.2);
            border-color: rgba(0, 255, 136, 0.5);
            color: #00ff88;
        }

        /* Enter Room Code Modal */
        .room-entry-dialog-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(16px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .room-entry-dialog-backdrop.active {
            display: flex;
        }

        .room-entry-card {
            background: linear-gradient(145deg, #0f172a, #0b0f19);
            border: 1px solid rgba(0, 242, 254, 0.4);
            border-radius: 24px;
            width: 100%;
            max-width: 380px;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 242, 254, 0.2);
            animation: modalSlideUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes modalSlideUp {
            from { transform: translateY(30px) scale(0.95); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        .room-code-input-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(0, 242, 254, 0.4);
            border-radius: 16px;
            padding: 10px 16px;
        }

        .room-prefix-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 20px;
            font-weight: 700;
            color: #00f2fe;
            letter-spacing: 1px;
        }

        .room-digits-input {
            width: 140px;
            background: transparent;
            border: none;
            color: #ffffff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 4px;
            text-align: center;
            outline: none;
        }

        .room-digits-input::placeholder {
            color: #475569;
        }

        .btn-connect-room-submit {
            background: linear-gradient(135deg, #00f2fe, #00ff88);
            color: #022c22;
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 255, 136, 0.4);
            transition: all 0.2s;
        }

        .btn-connect-room-submit:active {
            transform: scale(0.97);
        }

        /* OCR Result Showcase (Slide-up Bottom Sheet) */
        .ocr-result-bottom-sheet {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-height: 85dvh;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.98), rgba(8, 12, 22, 0.98));
            border-top: 1px solid rgba(0, 242, 254, 0.4);
            border-radius: 24px 24px 0 0;
            padding: 20px 18px max(24px, env(safe-area-inset-bottom, 24px)) 18px;
            z-index: 50;
            display: none;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 242, 254, 0.15);
            backdrop-filter: blur(20px);
            overflow-y: auto;
            animation: slideUpSheet 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .ocr-result-bottom-sheet.active {
            display: flex;
        }

        @keyframes slideUpSheet {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .result-sheet-handle {
            width: 40px;
            height: 4px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 2px;
            align-self: center;
            margin-bottom: 4px;
        }

        .result-text-preview-box {
            background: rgba(0, 242, 254, 0.06);
            border: 1px solid rgba(0, 242, 254, 0.25);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .result-text-headline {
            font-size: 20px;
            font-weight: 700;
            color: #00ff88;
            line-height: 1.4;
            word-break: break-word;
        }

        .btn-sync-to-pc-mega {
            background: linear-gradient(135deg, #00f2fe, #00ff88);
            color: #022c22;
            border: none;
            border-radius: 16px;
            padding: 16px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 25px rgba(0, 255, 136, 0.45);
            transition: all 0.2s;
        }

        .btn-sync-to-pc-mega:active {
            transform: scale(0.97);
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.3);
        }

        .hidden-el {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="mobile-camera-root">
        
        <!-- Top Controls Overlay -->
        <div class="mobile-top-bar">
            <a href="index.html" class="mobile-nav-btn" onclick="saveAndGoToIndex(event)" title="กลับสู่หน้าหลัก">
                <i class="fa-solid fa-house"></i>
            </a>

            <!-- Room Code Pill Button (Tap to enter/change room) -->
            <button class="mobile-room-pill" id="btnMobileRoomPill" onclick="openRoomEntryDialog()">
                <div class="status-dot-pulse" id="syncStatusIcon"></div>
                <span id="mobileSyncRoomLabel">ROOM: ใส่รหัสห้อง</span>
                <i class="fa-solid fa-chevron-down" style="font-size: 10px; margin-left: 2px;"></i>
            </button>

            <!-- Flip Camera Button -->
            <button class="mobile-nav-btn" id="btnFlipCamera" onclick="flipCameraFacingMode()" title="สลับกล้องหน้า/หลัง">
                <i class="fa-solid fa-camera-rotate"></i>
            </button>
        </div>

        <!-- Camera Viewport Area -->
        <div class="mobile-viewport-container" id="liveCameraSection">
            <video id="cameraVideo" autoplay playsinline muted></video>
            <canvas id="cameraCaptureCanvas" style="display:none;"></canvas>

            <!-- Book / Document Framing Box -->
            <div class="mobile-viewfinder-overlay" id="viewfinderBox">
                <div class="frame-guide-header">
                    <i class="fa-solid fa-expand"></i> วางข้อความให้อยู่ในกรอบ
                </div>
                <div style="font-size: 10px; color: #94a3b8; text-align: center;" id="focusStatusText">
                    [ กำลังหาโฟกัส ]
                </div>
            </div>
        </div>

        <!-- File Upload Section (Alternative Mode) -->
        <div id="uploadSection" style="display:none; position: absolute; inset: 0; z-index: 20; background: #0b0f19; padding: 80px 20px 20px 20px; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px;">
            <div class="upload-dropzone" id="mobileUploadDropzone" onclick="document.getElementById('fileInput').click()" style="width: 100%; max-width: 340px; border: 2px dashed #00f2fe; border-radius: 20px; padding: 40px 20px; text-align: center; cursor: pointer;">
                <i class="fa-solid fa-cloud-arrow-up" style="font-size: 48px; color: #00f2fe; margin-bottom: 12px;"></i>
                <div style="font-size: 16px; font-weight: 700; color: #fff;">เลือกรูปภาพจากเครื่อง</div>
                <div style="font-size: 12px; color: #94a3b8; margin-top: 4px;">รองรับ JPG, PNG, WEBP</div>
            </div>
            <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="handleFileSelected(event)">
        </div>

        <!-- Bottom Controls Bar -->
        <div class="mobile-bottom-controls">
            <!-- Auxiliary Mode Pills -->
            <div class="aux-pills-bar">
                <button class="aux-pill-btn active" id="btnToggleVoiceGuidance" onclick="if(typeof toggleVoiceGuidance==='function')toggleVoiceGuidance();">
                    <i class="fa-solid fa-volume-high"></i> <span id="voiceGuidanceText">เสียง: เปิด</span>
                </button>
                <button class="aux-pill-btn active" id="btnOcrLangToggle" onclick="toggleOcrLang();">
                    <i class="fa-solid fa-language"></i> <span id="ocrLangText">ภาษา: ไทย+EN</span>
                </button>
                <button class="aux-pill-btn" id="btnModeUploadSwitch" onclick="toggleUploadMode()">
                    <i class="fa-solid fa-image"></i> <span>คลังรูปภาพ</span>
                </button>
            </div>

            <!-- Shutter Controls Row -->
            <div class="shutter-row">
                <button class="btn-control-aux" onclick="openRoomEntryDialog()" title="ใส่รหัสเชื่อมต่อกับคอม">
                    <i class="fa-solid fa-qrcode"></i>
                </button>

                <!-- Primary Shutter Button -->
                <button class="btn-shutter-main" id="btnCapturePhoto" onclick="captureAndProcess()" title="แตะเพื่อถ่ายภาพ">
                    <div class="shutter-inner-dot">
                        <i class="fa-solid fa-camera"></i>
                    </div>
                </button>

                <button class="btn-control-aux" onclick="flipCameraFacingMode()" title="สลับกล้อง">
                    <i class="fa-solid fa-arrows-rotate"></i>
                </button>
            </div>
        </div>

        <!-- OCR Result Slide-up Bottom Sheet -->
        <div class="ocr-result-bottom-sheet" id="ocrResultSection">
            <div class="result-sheet-handle"></div>
            
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div style="font-size: 14px; font-weight: 700; color: #00f2fe; display: flex; align-items: center; gap: 6px;">
                    <i class="fa-solid fa-circle-check" style="color: #00ff88;"></i> ผลการตรวจจับข้อความ
                </div>
                <button onclick="speakResult()" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; border-radius: 20px; padding: 4px 12px; font-size: 12px; cursor: pointer;">
                    <i class="fa-solid fa-volume-high"></i> ฟังเสียง
                </button>
            </div>

            <div class="result-text-preview-box">
                <div class="result-text-headline" id="detectedTextDisplay">
                    กำลังประมวลผลข้อความ...
                </div>
                <div style="display: flex; justify-content: space-between; font-size: 11px; color: #94a3b8; font-family: 'JetBrains Mono', monospace;">
                    <span id="ocrConfidenceTag">ความมั่นใจ: 95%</span>
                    <span id="pageBadge">เฟรม 1/1</span>
                </div>
            </div>

            <!-- Big Sync Button -->
            <button class="btn-sync-to-pc-mega" id="btnSyncToPc" onclick="syncActiveTextToPC()">
                <i class="fa-solid fa-paper-plane"></i>
                <span>ส่งเข้าคอมพิวเตอร์ (Sync to PC)</span>
            </button>

            <div style="display: flex; gap: 10px;">
                <button class="btn-action-secondary" onclick="resetToScanAgain()" style="flex: 1; padding: 12px; justify-content: center;">
                    <i class="fa-solid fa-rotate-right"></i> ถ่ายใหม่
                </button>
                <a href="index.html" class="btn-action-secondary" onclick="saveAndGoToIndex(event)" style="flex: 1; padding: 12px; justify-content: center;">
                    <i class="fa-solid fa-laptop"></i> หน้าจอหลัก
                </a>
            </div>
        </div>

        <!-- Room Code Quick Entry Dialog -->
        <div class="room-entry-dialog-backdrop" id="roomEntryDialog" onclick="if(event.target===this)closeRoomEntryDialog()">
            <div class="room-entry-card">
                <div style="font-size: 20px; font-weight: 700; color: #00f2fe; display: flex; align-items: center; justify-content: center; gap: 8px;">
                    <i class="fa-solid fa-mobile-screen-button"></i>
                    <span>เชื่อมต่อกับคอมพิวเตอร์</span>
                </div>
                <div style="font-size: 13px; color: #94a3b8; line-height: 1.4;">
                    กรอกรหัส 4 หลักที่ปรากฏบนหน้าจอคอมพิวเตอร์ของคุณ (เช่น ROOM: BR-<b>7237</b>)
                </div>

                <div class="room-code-input-wrap">
                    <span class="room-prefix-tag">BR-</span>
                    <input type="tel" maxlength="4" class="room-digits-input" id="inputRoomDigits" placeholder="7237" autofocus />
                </div>

                <button class="btn-connect-room-submit" onclick="submitRoomDigits()">
                    <i class="fa-solid fa-link"></i> เชื่อมต่อทันที
                </button>

                <button onclick="closeRoomEntryDialog()" style="background: transparent; border: none; color: #64748b; font-size: 12px; cursor: pointer; padding: 4px;">
                    ใช้งานแบบไม่เชื่อมต่อ (Standalone)
                </button>
            </div>
        </div>

    </div>

    <!-- Hidden Subsystems (Preserves Background Logic & Test DOM IDs) -->
    <div class="hidden-el">
        <span class="ocr-lang-badge">TH + EN (EasyOCR)</span>
        <textarea id="thaiInput">สวัสดีครับ</textarea>
        <div id="ocrDropzone"></div>
        <div id="cellsGrid"></div>
        <button id="btnOpenLiveCamera"></button>
        <button id="btnPreviewInspector"></button>
        <button id="btnRemoveImage"></button>
        <button id="btnTriggerFileBrowse"></button>
        <button id="btnDemoMode"></button>
        <button id="btnOpenOcrInspector"></button>
        <button id="btnCloseOcrInspector"></button>
        <button id="btnPrevPage"></button>
        <div id="pageIndicator"></div>
        <button id="btnNextPage"></button>
        <button id="btnToggleLanguageMode"></button>
        <button id="btnViewFront"></button>
        <button id="btnViewBack"></button>
        <button id="btnView3D"></button>
        <button id="btnViewXray"></button>
        <button id="presentBtn"></button>
        <button id="lightModeBtn"></button>
        <span id="powerStatus"></span>
        <canvas id="ocrResultCanvasInspector"></canvas>
        <div id="viewfinderFrame"></div>
        <div id="cornerTL"></div>
        <div id="cornerTR"></div>
        <div id="cornerBL"></div>
        <div id="cornerBR"></div>
        <div id="labelTL"></div>
        <div id="labelTR"></div>
        <div id="labelBL"></div>
        <div id="labelBR"></div>
        <div id="cornerStatusOverlay"></div>
        <div id="cornerAlignmentText"></div>
        <div id="focusStatusHud"></div>
        <div id="voiceStatusHud"></div>
        <div id="voiceStatusMsg"></div>
        <div id="btnToggleAutoCapture"></div>
        <div id="autoCaptureText"></div>
        <div id="tabLiveCamBtn"></div>
        <div id="tabUploadBtn"></div>
        <div id="uploadPreviewWrap"></div>
        <div id="brailleCellsGrid"></div>
        <div id="ocrSuccessBadge"></div>
        <button id="btnPrev"></button>
        <button id="btnNext"></button>
        <a id="btnGoToIndexWorkstation"></a>
    </div>

    <!-- Firebase Firestore Compat SDK & Real-time Sync Engine -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="js/firebase-sync.js"></script>

    <!-- In-Browser OCR Engine (Tesseract.js Thai + English) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <!-- JavaScript Modules -->
    <script src="js/textProcessor.js"></script>
    <script src="js/camera.js"></script>
    <script src="js/ocr.js"></script>
    <script src="js/demoMode.js"></script>
    <script src="js/thai-braille-tables.js"></script>
    <script src="js/thai-wordlist.js"></script>
    <script src="js/thai-braille.js"></script>
    <script src="js/braille-engine.js"></script>
    <script src="js/voice-guidance.js"></script>
    <script src="js/ocr-engine.js"></script>

    <script>
        let currentMode = 'camera';
        let activeFullText = '';
        let activeChunks = [];
        let activeChunkIdx = 0;
        let selectedUploadFile = null;
        let isCapturing = false;
        let currentFacingMode = 'environment';
        let activeSyncRoom = null;

        function saveAndGoToIndex(e) {
            if (activeFullText && activeFullText.trim()) {
                try {
                    localStorage.setItem('braillend_last_ocr_text', activeFullText.trim());
                } catch (err) {
                    console.warn('localStorage save warning:', err);
                }
            }
        }

        function toggleUploadMode() {
            const upSec = document.getElementById('uploadSection');
            const camSec = document.getElementById('liveCameraSection');
            if (currentMode === 'camera') {
                currentMode = 'upload';
                camSec.style.display = 'none';
                upSec.style.display = 'flex';
                stopCameraStream();
            } else {
                currentMode = 'camera';
                upSec.style.display = 'none';
                camSec.style.display = 'flex';
                startLiveCamera();
            }
        }

        async function flipCameraFacingMode() {
            currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
            stopCameraStream();
            await startCameraStream(currentFacingMode);
        }

        async function startLiveCamera() {
            try {
                await startCameraStream(currentFacingMode);
                if (typeof startLiveVoiceGuidance === 'function') startLiveVoiceGuidance();
            } catch (e) {
                console.warn('Camera stream notice:', e);
            }
        }

        // Capture photo & trigger OCR
        async function captureAndProcess() {
            if (isCapturing) return;
            isCapturing = true;

            const video = document.getElementById('cameraVideo');
            let capturedDataUrl = '';

            if (video && (video.videoWidth > 0 || video.readyState >= 2)) {
                const w = video.videoWidth || 1080;
                const h = video.videoHeight || 1920;
                const offCanvas = document.createElement('canvas');
                offCanvas.width = w;
                offCanvas.height = h;
                offCanvas.getContext('2d').drawImage(video, 0, 0, w, h);
                capturedDataUrl = offCanvas.toDataURL('image/jpeg', 0.95);
            }

            stopCameraStream();
            if (typeof stopLiveVoiceGuidance === 'function') stopLiveVoiceGuidance();

            if (capturedDataUrl) {
                runOcrOnCapture(capturedDataUrl);
            } else {
                isCapturing = false;
                startLiveCamera();
            }
        }

        function handleFileSelected(event) {
            const file = event.target.files && event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const dataUrl = e.target.result;
                    runOcrOnCapture(dataUrl);
                };
                reader.readAsDataURL(file);
            }
        }

        async function runOcrOnCapture(imageSrc) {
            const sheet = document.getElementById('ocrResultSection');
            const display = document.getElementById('detectedTextDisplay');
            if (sheet) sheet.classList.add('active');
            if (display) display.textContent = 'กำลังสแกนและอ่านข้อความ...';

            try {
                let recognizedText = '';
                let confidence = 95;

                if (typeof extractTextFromImageDirect === 'function') {
                    const res = await extractTextFromImageDirect(imageSrc);
                    if (res && res.text) {
                        recognizedText = res.text.trim();
                        confidence = res.confidence || 95;
                    }
                } else if (typeof Tesseract !== 'undefined') {
                    const worker = await Tesseract.createWorker('tha+eng');
                    const ret = await worker.recognize(imageSrc);
                    recognizedText = ret.data.text.trim();
                    confidence = ret.data.confidence || 90;
                    await worker.terminate();
                }

                activeFullText = recognizedText || 'ไม่พบข้อความในภาพ';
                if (display) display.textContent = `"${activeFullText}"`;
                const confTag = document.getElementById('ocrConfidenceTag');
                if (confTag) confTag.textContent = `ความมั่นใจ: ${confidence}%`;

                // Auto-sync if connected to PC room
                if (activeSyncRoom && activeFullText && typeof BrailleSync !== 'undefined') {
                    BrailleSync.sendOCRResult(activeFullText, { confidence: confidence, rawText: activeFullText });
                }

            } catch (err) {
                console.error('OCR Error:', err);
                if (display) display.textContent = 'เกิดข้อผิดพลาดในการสแกนข้อความ';
            } finally {
                isCapturing = false;
            }
        }

        function resetToScanAgain() {
            const sheet = document.getElementById('ocrResultSection');
            if (sheet) sheet.classList.remove('active');
            activeFullText = '';
            isCapturing = false;
            startLiveCamera();
        }

        function speakResult() {
            if ('speechSynthesis' in window && activeFullText) {
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(activeFullText);
                utter.lang = 'th-TH';
                utter.rate = 0.95;
                window.speechSynthesis.speak(utter);
            }
        }

        // --- Room Management & Modal Handlers ---
        function openRoomEntryDialog() {
            const dialog = document.getElementById('roomEntryDialog');
            if (dialog) dialog.classList.add('active');
            const input = document.getElementById('inputRoomDigits');
            if (input) {
                input.value = activeSyncRoom ? activeSyncRoom.replace('BR-', '') : '';
                input.focus();
            }
        }

        function closeRoomEntryDialog() {
            const dialog = document.getElementById('roomEntryDialog');
            if (dialog) dialog.classList.remove('active');
        }

        function submitRoomDigits() {
            const input = document.getElementById('inputRoomDigits');
            if (!input || !input.value.trim()) {
                alert('กรุณากรอกรหัสห้อง 4 หลักที่แสดงบนคอมพิวเตอร์');
                return;
            }
            let val = input.value.trim().toUpperCase();
            if (!val.startsWith('BR-')) {
                val = `BR-${val}`;
            }
            joinSyncRoom(val);
            closeRoomEntryDialog();
        }

        function initSync() {
            if (typeof BrailleSync !== 'undefined') {
                BrailleSync.init();
                const room = BrailleSync.getRoomFromUrl();
                if (room) {
                    joinSyncRoom(room);
                } else {
                    const saved = localStorage.getItem('braillbox_active_room');
                    if (saved) {
                        joinSyncRoom(saved);
                    } else {
                        // Prompt user immediately if mobile without room
                        setTimeout(openRoomEntryDialog, 600);
                    }
                }
            }
        }

        function joinSyncRoom(roomId) {
            if (!roomId) return;
            activeSyncRoom = roomId.trim().toUpperCase();
            if (typeof BrailleSync !== 'undefined') {
                BrailleSync.joinRoom(activeSyncRoom, 'Mobile Camera (Thai OCR)');
                
                const label = document.getElementById('mobileSyncRoomLabel');
                const dot = document.getElementById('syncStatusIcon');
                const pill = document.getElementById('btnMobileRoomPill');
                
                if (label) label.textContent = `ROOM: ${activeSyncRoom}`;
                if (dot) dot.classList.add('connected');
                if (pill) pill.classList.add('connected');
            }
        }

        async function syncActiveTextToPC() {
            if (!activeFullText || !activeFullText.trim()) {
                alert('ยังไม่มีข้อความจากการถ่ายภาพ/OCR');
                return;
            }

            if (!activeSyncRoom) {
                openRoomEntryDialog();
                return;
            }

            if (typeof BrailleSync !== 'undefined') {
                const btn = document.getElementById('btnSyncToPc');
                const originalHtml = btn ? btn.innerHTML : '';
                if (btn) {
                    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>กำลังส่งไปยังคอมพิวเตอร์...</span>';
                }

                const res = await BrailleSync.sendOCRResult(activeFullText, {
                    confidence: 95,
                    rawText: activeFullText
                });

                if (res && btn) {
                    btn.innerHTML = '<i class="fa-solid fa-circle-check"></i> <span>ส่งไปยังคอมพิวเตอร์สำเร็จแล้ว!</span>';
                    btn.style.background = '#00ff88';
                    setTimeout(() => {
                        btn.innerHTML = originalHtml;
                        btn.style.background = 'linear-gradient(135deg, #00f2fe, #00ff88)';
                    }, 2500);
                }
            }
        }

        // Initialize on DOM load
        window.addEventListener('DOMContentLoaded', () => {
            initSync();
            startLiveCamera();
        });
    </script>
</body>
</html>
