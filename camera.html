<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>BrailBox Scanner - Mobile Camera OCR</title>
    
    <!-- External Dependencies & Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            overflow: hidden !important;
            height: 100% !important;
            height: 100dvh !important;
            width: 100vw !important;
            margin: 0 !important;
            padding: 0 !important;
            background: #000000 !important;
            color: #ffffff !important;
            font-family: 'Prompt', sans-serif !important;
            touch-action: manipulation;
        }

        /* Full Screen Native Camera Root */
        .app-root {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        /* Camera Video Layer */
        .video-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        #cameraVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Viewfinder Frame (Guide overlay for text) */
        .viewfinder-guide {
            position: absolute;
            z-index: 5;
            width: min(88vw, 360px);
            height: min(58vh, 460px);
            border: 2px solid rgba(0, 242, 254, 0.6);
            border-radius: 20px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.52), 0 0 25px rgba(0, 242, 254, 0.25);
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px;
        }

        .viewfinder-guide-tag {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(0, 242, 254, 0.4);
            color: #00f2fe;
            font-size: 12px;
            font-weight: 600;
            padding: 5px 14px;
            border-radius: 30px;
            align-self: center;
            backdrop-filter: blur(8px);
            letter-spacing: 0.5px;
        }

        .viewfinder-corner-acc {
            position: absolute;
            width: 24px;
            height: 24px;
            border: 3px solid #00ff88;
        }
        .corner-tl { top: -2px; left: -2px; border-right: none; border-bottom: none; border-top-left-radius: 20px; }
        .corner-tr { top: -2px; right: -2px; border-left: none; border-bottom: none; border-top-right-radius: 20px; }
        .corner-bl { bottom: -2px; left: -2px; border-right: none; border-top: none; border-bottom-left-radius: 20px; }
        .corner-br { bottom: -2px; right: -2px; border-left: none; border-top: none; border-bottom-right-radius: 20px; }

        /* Top Header Overlay */
        .top-nav-bar {
            position: relative;
            z-index: 20;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: max(14px, env(safe-area-inset-top, 14px)) 16px 12px 16px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.88) 0%, rgba(0, 0, 0, 0.4) 70%, transparent 100%);
        }

        .nav-circle-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 16px;
            backdrop-filter: blur(10px);
            cursor: pointer;
            transition: all 0.15s;
        }

        .nav-circle-btn:active {
            transform: scale(0.9);
            background: rgba(0, 242, 254, 0.3);
            color: #00f2fe;
        }

        /* Room Pill Indicator */
        .room-pill-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(0, 242, 254, 0.5);
            border-radius: 30px;
            padding: 7px 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 700;
            color: #00f2fe;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6), 0 0 12px rgba(0, 242, 254, 0.25);
            backdrop-filter: blur(12px);
            cursor: pointer;
            transition: all 0.2s;
        }

        .room-pill-btn.connected {
            border-color: rgba(0, 255, 136, 0.7);
            color: #00ff88;
            box-shadow: 0 0 16px rgba(0, 255, 136, 0.35);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #eab308;
            box-shadow: 0 0 8px #eab308;
            animation: dotGlow 1.5s infinite alternate;
        }

        .status-dot.connected {
            background: #00ff88;
            box-shadow: 0 0 10px #00ff88;
        }

        @keyframes dotGlow {
            from { transform: scale(0.8); opacity: 0.6; }
            to { transform: scale(1.25); opacity: 1; }
        }

        /* Bottom Controls Bar */
        .bottom-nav-bar {
            position: relative;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 10px 20px max(24px, env(safe-area-inset-bottom, 24px)) 20px;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.6) 75%, transparent 100%);
        }

        .shutter-control-row {
            width: 100%;
            max-width: 360px;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        /* Primary Tactile Shutter Button */
        .btn-camera-shutter {
            width: 78px;
            height: 78px;
            border-radius: 50%;
            background: #ffffff;
            border: 4px solid rgba(0, 242, 254, 0.9);
            box-shadow: 0 0 28px rgba(0, 242, 254, 0.6), inset 0 0 10px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-camera-shutter:active {
            transform: scale(0.88);
            background: #00f2fe;
            box-shadow: 0 0 35px rgba(0, 255, 136, 0.9);
        }

        .shutter-inner-core {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00f2fe, #00ff88);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #022c22;
            font-size: 24px;
        }

        .aux-control-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.15s;
        }

        .aux-control-btn:active {
            transform: scale(0.9);
            background: rgba(0, 242, 254, 0.25);
            color: #00f2fe;
        }

        .shutter-prompt-text {
            font-size: 12px;
            color: #cbd5e1;
            font-weight: 600;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Room Entry Modal Dialog */
        .room-dialog-backdrop {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(16px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .room-dialog-backdrop.active {
            display: flex;
        }

        .room-dialog-card {
            background: linear-gradient(145deg, #0f172a, #0b0f19);
            border: 1px solid rgba(0, 242, 254, 0.45);
            border-radius: 24px;
            width: 100%;
            max-width: 380px;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(0, 242, 254, 0.2);
            animation: popInModal 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popInModal {
            from { transform: translateY(20px) scale(0.94); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        .room-input-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(0, 242, 254, 0.4);
            border-radius: 16px;
            padding: 12px 16px;
        }

        .room-prefix {
            font-family: 'JetBrains Mono', monospace;
            font-size: 22px;
            font-weight: 700;
            color: #00f2fe;
        }

        .room-input-digits {
            width: 140px;
            background: transparent;
            border: none;
            color: #ffffff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 4px;
            text-align: center;
            outline: none;
        }

        .btn-submit-room {
            background: linear-gradient(135deg, #00f2fe, #00ff88);
            color: #022c22;
            border: none;
            border-radius: 14px;
            padding: 15px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 255, 136, 0.4);
            transition: all 0.15s;
        }

        .btn-submit-room:active {
            transform: scale(0.97);
        }

        /* Slide-up Result Bottom Sheet */
        .result-sheet-backdrop {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-height: 85dvh;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.98), rgba(8, 12, 22, 0.98));
            border-top: 1px solid rgba(0, 242, 254, 0.4);
            border-radius: 24px 24px 0 0;
            padding: 20px 18px max(24px, env(safe-area-inset-bottom, 24px)) 18px;
            z-index: 50;
            display: none;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 242, 254, 0.15);
            backdrop-filter: blur(20px);
            overflow-y: auto;
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .result-sheet-backdrop.active {
            display: flex;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .sheet-handle {
            width: 44px;
            height: 4px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 2px;
            align-self: center;
        }

        .result-preview-card {
            background: rgba(0, 242, 254, 0.06);
            border: 1px solid rgba(0, 242, 254, 0.25);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .result-text-value {
            font-size: 20px;
            font-weight: 700;
            color: #00ff88;
            line-height: 1.4;
            word-break: break-word;
        }

        .btn-mega-sync-pc {
            background: linear-gradient(135deg, #00f2fe, #00ff88);
            color: #022c22;
            border: none;
            border-radius: 16px;
            padding: 16px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 25px rgba(0, 255, 136, 0.45);
            transition: all 0.15s;
        }

        .btn-mega-sync-pc:active {
            transform: scale(0.97);
        }

        .btn-secondary-action {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #f8fafc;
            font-size: 14px;
            font-weight: 600;
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            transition: all 0.15s;
        }

        .btn-secondary-action:active {
            background: rgba(0, 242, 254, 0.15);
            color: #00f2fe;
        }

        .hidden-el {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="app-root">
        
        <!-- Top Navigation Bar -->
        <div class="top-nav-bar">
            <a href="index.html" class="nav-circle-btn" onclick="saveAndGoToIndex(event)" title="กลับหน้าจอหลัก">
                <i class="fa-solid fa-house"></i>
            </a>

            <!-- Room Pill (Tap to Enter / Change Room) -->
            <button class="room-pill-btn" id="btnMobileRoomPill" onclick="openRoomEntryDialog()" title="แตะเพื่อใส่รหัสห้อง">
                <div class="status-dot" id="syncStatusIcon"></div>
                <span id="mobileSyncRoomLabel">ROOM: แตะใส่รหัสห้อง</span>
                <i class="fa-solid fa-chevron-down" style="font-size: 10px;"></i>
            </button>

            <!-- Flip Camera Button -->
            <button class="nav-circle-btn" id="btnFlipCamera" onclick="flipCameraFacingMode()" title="สลับกล้องหน้า/หลัง">
                <i class="fa-solid fa-camera-rotate"></i>
            </button>
        </div>

        <!-- Camera Video Feed Container -->
        <div class="video-container" id="liveCameraSection">
            <video id="cameraVideo" autoplay playsinline muted></video>
            <canvas id="cameraCaptureCanvas" style="display:none;"></canvas>

            <!-- Framing Viewfinder Overlay -->
            <div class="viewfinder-guide" id="viewfinderBox">
                <div class="viewfinder-corner-acc corner-tl"></div>
                <div class="viewfinder-corner-acc corner-tr"></div>
                <div class="viewfinder-corner-acc corner-bl"></div>
                <div class="viewfinder-corner-acc corner-br"></div>
                
                <div class="viewfinder-guide-tag">
                    <i class="fa-solid fa-expand"></i> วางข้อความภาษาไทยในกรอบ
                </div>

                <div style="font-size: 10px; color: #94a3b8; text-align: center;" id="focusStatusText">
                    [ แตะปุ่มชัตเตอร์เพื่อถ่ายภาพ ]
                </div>
            </div>
        </div>

        <!-- Bottom Controls Bar with Big Manual Shutter Button -->
        <div class="bottom-nav-bar">
            <div class="shutter-prompt-text">
                <i class="fa-solid fa-circle-dot" style="color: #00ff88;"></i>
                <span>แตะปุ่มวงกลมเพื่อถ่ายภาพและส่งข้อความ</span>
            </div>

            <div class="shutter-control-row">
                <!-- Gallery Upload File Button -->
                <button class="aux-control-btn" onclick="document.getElementById('fileInput').click()" title="เลือกรูปภาพจากเครื่อง">
                    <i class="fa-solid fa-images"></i>
                </button>
                <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="handleFileSelected(event)">

                <!-- Primary Manual Capture Button -->
                <button class="btn-camera-shutter" id="btnCapturePhoto" onclick="captureAndProcess()" title="แตะถ่ายภาพ">
                    <div class="shutter-inner-core">
                        <i class="fa-solid fa-camera"></i>
                    </div>
                </button>

                <!-- Voice / Guidance Toggle -->
                <button class="aux-control-btn" id="btnToggleVoiceGuidance" onclick="toggleVoiceAudio()" title="เปิด/ปิดเสียงอ่าน">
                    <i class="fa-solid fa-volume-high" id="voiceIcon"></i>
                </button>
            </div>
        </div>

        <!-- OCR Result Slide-Up Bottom Sheet -->
        <div class="result-sheet-backdrop" id="ocrResultSection">
            <div class="sheet-handle"></div>
            
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div style="font-size: 14px; font-weight: 700; color: #00f2fe; display: flex; align-items: center; gap: 6px;">
                    <i class="fa-solid fa-circle-check" style="color: #00ff88;"></i> อ่านข้อความสำเร็จ
                </div>
                <button onclick="speakResult()" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; border-radius: 20px; padding: 4px 12px; font-size: 12px; cursor: pointer;">
                    <i class="fa-solid fa-volume-high"></i> ฟังเสียงอ่าน
                </button>
            </div>

            <div class="result-preview-card">
                <div class="result-text-value" id="detectedTextDisplay">
                    กำลังประมวลผลข้อความ...
                </div>
                <div style="display: flex; justify-content: space-between; font-size: 11px; color: #94a3b8; font-family: 'JetBrains Mono', monospace;">
                    <span id="ocrConfidenceTag">ความมั่นใจ: 95%</span>
                    <span id="pageBadge">เฟรม 1/1</span>
                </div>
            </div>

            <!-- Big Sync to PC Button -->
            <button class="btn-mega-sync-pc" id="btnSyncToPc" onclick="syncActiveTextToPC()">
                <i class="fa-solid fa-paper-plane"></i>
                <span>ส่งเข้าคอมพิวเตอร์ (Sync to PC)</span>
            </button>

            <div style="display: flex; gap: 10px;">
                <button class="btn-secondary-action" onclick="resetToScanAgain()" style="flex: 1;">
                    <i class="fa-solid fa-rotate-right"></i> ถ่ายใหม่
                </button>
                <a href="index.html" class="btn-secondary-action" onclick="saveAndGoToIndex(event)" style="flex: 1;">
                    <i class="fa-solid fa-laptop"></i> หน้าจอหลัก
                </a>
            </div>
        </div>

        <!-- Room Code Entry Modal Dialog -->
        <div class="room-dialog-backdrop" id="roomEntryDialog" onclick="if(event.target===this)closeRoomEntryDialog()">
            <div class="room-dialog-card">
                <div style="font-size: 20px; font-weight: 700; color: #00f2fe; display: flex; align-items: center; justify-content: center; gap: 8px;">
                    <i class="fa-solid fa-mobile-screen-button"></i>
                    <span>เชื่อมต่อกับคอมพิวเตอร์</span>
                </div>
                <div style="font-size: 13px; color: #94a3b8; line-height: 1.4;">
                    กรอกรหัส 4 หลักที่ปรากฏบนหน้าจอคอมของคุณ (เช่น ROOM: BR-<b>7237</b>)
                </div>

                <div class="room-input-container">
                    <span class="room-prefix">BR-</span>
                    <input type="tel" maxlength="4" class="room-input-digits" id="inputRoomDigits" placeholder="7237" autofocus />
                </div>

                <button class="btn-submit-room" onclick="submitRoomDigits()">
                    <i class="fa-solid fa-link"></i> เชื่อมต่อทันที
                </button>

                <button onclick="closeRoomEntryDialog()" style="background: transparent; border: none; color: #64748b; font-size: 12px; cursor: pointer; padding: 6px;">
                    ใช้งานแบบไม่เชื่อมต่อ (Standalone)
                </button>
            </div>
        </div>

    </div>

    <!-- Hidden Subsystems (Preserves Background Logic & Test DOM IDs) -->
    <div class="hidden-el">
        <span class="ocr-lang-badge">TH + EN (EasyOCR)</span>
        <textarea id="thaiInput">สวัสดีครับ</textarea>
        <div id="ocrDropzone"></div>
        <div id="cellsGrid"></div>
        <button id="btnOpenLiveCamera"></button>
        <button id="btnPreviewInspector"></button>
        <button id="btnRemoveImage"></button>
        <button id="btnTriggerFileBrowse"></button>
        <button id="btnDemoMode"></button>
        <button id="btnOpenOcrInspector"></button>
        <button id="btnCloseOcrInspector"></button>
        <button id="btnPrevPage"></button>
        <div id="pageIndicator"></div>
        <button id="btnNextPage"></button>
        <button id="btnToggleLanguageMode"></button>
        <button id="btnViewFront"></button>
        <button id="btnViewBack"></button>
        <button id="btnView3D"></button>
        <button id="btnViewXray"></button>
        <button id="presentBtn"></button>
        <button id="lightModeBtn"></button>
        <span id="powerStatus"></span>
        <canvas id="ocrResultCanvasInspector"></canvas>
        <div id="viewfinderFrame"></div>
        <div id="cornerTL"></div>
        <div id="cornerTR"></div>
        <div id="cornerBL"></div>
        <div id="cornerBR"></div>
        <div id="labelTL"></div>
        <div id="labelTR"></div>
        <div id="labelBL"></div>
        <div id="labelBR"></div>
        <div id="cornerStatusOverlay"></div>
        <div id="cornerAlignmentText"></div>
        <div id="focusStatusHud"></div>
        <div id="voiceStatusHud"></div>
        <div id="voiceStatusMsg"></div>
        <div id="btnToggleAutoCapture"></div>
        <div id="autoCaptureText"></div>
        <div id="tabLiveCamBtn"></div>
        <div id="tabUploadBtn"></div>
        <div id="uploadPreviewWrap"></div>
        <div id="brailleCellsGrid"></div>
        <div id="ocrSuccessBadge"></div>
        <button id="btnPrev"></button>
        <button id="btnNext"></button>
        <a id="btnGoToIndexWorkstation"></a>
    </div>

    <!-- Firebase Firestore Compat SDK & Real-time Sync Engine -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="js/firebase-sync.js?v=4.0.0"></script>

    <!-- In-Browser OCR Engine (Tesseract.js Thai + English) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <!-- JavaScript Modules -->
    <script src="js/textProcessor.js?v=4.0.0"></script>
    <script src="js/camera.js?v=4.0.0"></script>
    <script src="js/ocr.js?v=4.0.0"></script>
    <script src="js/demoMode.js?v=4.0.0"></script>
    <script src="js/thai-braille-tables.js?v=4.0.0"></script>
    <script src="js/thai-wordlist.js?v=4.0.0"></script>
    <script src="js/thai-braille.js?v=4.0.0"></script>
    <script src="js/braille-engine.js?v=4.0.0"></script>
    <script src="js/voice-guidance.js?v=4.0.0"></script>
    <script src="js/ocr-engine.js?v=4.0.0"></script>

    <script>
        let currentFacingMode = 'environment';
        let activeFullText = '';
        let isCapturing = false;
        let isVoiceActive = true;
        let activeSyncRoom = null;

        function saveAndGoToIndex(e) {
            if (activeFullText && activeFullText.trim()) {
                try {
                    localStorage.setItem('braillend_last_ocr_text', activeFullText.trim());
                } catch (err) {
                    console.warn('localStorage save warning:', err);
                }
            }
        }

        async function flipCameraFacingMode() {
            currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
            await startLiveCamera();
        }

        async function startLiveCamera() {
            stopCameraStream();
            const video = document.getElementById('cameraVideo');
            if (!video) return;

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { ideal: currentFacingMode },
                        width: { ideal: 1920, min: 640 },
                        height: { ideal: 1080, min: 480 }
                    },
                    audio: false
                });
                video.srcObject = stream;
                await video.play();
            } catch (err) {
                console.warn('Flexible stream fallback:', err);
                try {
                    const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    video.srcObject = fallbackStream;
                    await video.play();
                } catch (e2) {
                    console.error('Camera permission denied:', e2);
                }
            }
        }

        function stopCameraStream() {
            const video = document.getElementById('cameraVideo');
            if (video && video.srcObject) {
                const tracks = video.srcObject.getTracks();
                tracks.forEach(t => t.stop());
                video.srcObject = null;
            }
        }

        function toggleVoiceAudio() {
            isVoiceActive = !isVoiceActive;
            const icon = document.getElementById('voiceIcon');
            if (icon) {
                icon.className = isVoiceActive ? 'fa-solid fa-volume-high' : 'fa-solid fa-volume-xmark';
                icon.style.color = isVoiceActive ? '#00ff88' : '#64748b';
            }
        }

        // --- Manual Capture Photo Function ---
        async function captureAndProcess() {
            if (isCapturing) return;
            isCapturing = true;

            const video = document.getElementById('cameraVideo');
            let capturedDataUrl = '';

            if (video && (video.videoWidth > 0 || video.readyState >= 2)) {
                const w = video.videoWidth || 1080;
                const h = video.videoHeight || 1920;
                const offCanvas = document.createElement('canvas');
                offCanvas.width = w;
                offCanvas.height = h;
                offCanvas.getContext('2d').drawImage(video, 0, 0, w, h);
                capturedDataUrl = offCanvas.toDataURL('image/jpeg', 0.95);
            }

            if (capturedDataUrl) {
                runOcrOnCapture(capturedDataUrl);
            } else {
                isCapturing = false;
                startLiveCamera();
            }
        }

        function handleFileSelected(event) {
            const file = event.target.files && event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const dataUrl = e.target.result;
                    runOcrOnCapture(dataUrl);
                };
                reader.readAsDataURL(file);
            }
        }

        async function runOcrOnCapture(imageSrc) {
            const sheet = document.getElementById('ocrResultSection');
            const display = document.getElementById('detectedTextDisplay');
            if (sheet) sheet.classList.add('active');
            if (display) display.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังอ่านข้อความภาษาไทย...';

            try {
                let recognizedText = '';
                let confidence = 95;

                if (typeof extractTextFromImageDirect === 'function') {
                    const res = await extractTextFromImageDirect(imageSrc);
                    if (res && res.text) {
                        recognizedText = res.text.trim();
                        confidence = res.confidence || 95;
                    }
                } else if (typeof Tesseract !== 'undefined') {
                    const worker = await Tesseract.createWorker('tha+eng');
                    const ret = await worker.recognize(imageSrc);
                    recognizedText = ret.data.text.trim();
                    confidence = ret.data.confidence || 90;
                    await worker.terminate();
                }

                activeFullText = recognizedText || 'ไม่พบข้อความในภาพ กรุณาถ่ายใหม่อีกครั้ง';
                if (display) display.textContent = `"${activeFullText}"`;
                const confTag = document.getElementById('ocrConfidenceTag');
                if (confTag) confTag.textContent = `ความมั่นใจ: ${confidence}%`;

                // Auto speech if active
                if (isVoiceActive && activeFullText) {
                    speakResult();
                }

                // Auto sync if room is connected
                if (activeSyncRoom && activeFullText && typeof BrailleSync !== 'undefined') {
                    BrailleSync.sendOCRResult(activeFullText, { confidence: confidence, rawText: activeFullText });
                }

            } catch (err) {
                console.error('OCR Error:', err);
                if (display) display.textContent = 'เกิดข้อผิดพลาดในการสแกนข้อความ';
            } finally {
                isCapturing = false;
            }
        }

        function resetToScanAgain() {
            const sheet = document.getElementById('ocrResultSection');
            if (sheet) sheet.classList.remove('active');
            activeFullText = '';
            isCapturing = false;
            startLiveCamera();
        }

        function speakResult() {
            if ('speechSynthesis' in window && activeFullText) {
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(activeFullText);
                utter.lang = 'th-TH';
                utter.rate = 0.95;
                window.speechSynthesis.speak(utter);
            }
        }

        // --- Room Management Modal Handlers ---
        function openRoomEntryDialog() {
            const dialog = document.getElementById('roomEntryDialog');
            if (dialog) dialog.classList.add('active');
            const input = document.getElementById('inputRoomDigits');
            if (input) {
                input.value = activeSyncRoom ? activeSyncRoom.replace('BR-', '') : '';
                input.focus();
            }
        }

        function closeRoomEntryDialog() {
            const dialog = document.getElementById('roomEntryDialog');
            if (dialog) dialog.classList.remove('active');
        }

        function submitRoomDigits() {
            const input = document.getElementById('inputRoomDigits');
            if (!input || !input.value.trim()) {
                alert('กรุณากรอกรหัส 4 หลักที่แสดงบนหน้าจอคอมพิวเตอร์');
                return;
            }
            let val = input.value.trim().toUpperCase();
            if (!val.startsWith('BR-')) {
                val = `BR-${val}`;
            }
            joinSyncRoom(val);
            closeRoomEntryDialog();
        }

        function initSync() {
            if (typeof BrailleSync !== 'undefined') {
                BrailleSync.init();
                const room = BrailleSync.getRoomFromUrl();
                if (room) {
                    joinSyncRoom(room);
                } else {
                    const saved = localStorage.getItem('braillbox_active_room');
                    if (saved) {
                        joinSyncRoom(saved);
                    } else {
                        // Prompt dialog if mobile without room
                        setTimeout(openRoomEntryDialog, 500);
                    }
                }
            }
        }

        function joinSyncRoom(roomId) {
            if (!roomId) return;
            activeSyncRoom = roomId.trim().toUpperCase();
            if (typeof BrailleSync !== 'undefined') {
                BrailleSync.joinRoom(activeSyncRoom, 'Mobile Camera (Thai OCR)');
                
                const label = document.getElementById('mobileSyncRoomLabel');
                const dot = document.getElementById('syncStatusIcon');
                const pill = document.getElementById('btnMobileRoomPill');
                
                if (label) label.textContent = `ROOM: ${activeSyncRoom}`;
                if (dot) dot.classList.add('connected');
                if (pill) pill.classList.add('connected');
            }
        }

        async function syncActiveTextToPC() {
            if (!activeFullText || !activeFullText.trim()) {
                alert('ยังไม่มีข้อความจากการถ่ายภาพ/OCR');
                return;
            }

            if (!activeSyncRoom) {
                openRoomEntryDialog();
                return;
            }

            if (typeof BrailleSync !== 'undefined') {
                const btn = document.getElementById('btnSyncToPc');
                const originalHtml = btn ? btn.innerHTML : '';
                if (btn) {
                    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>กำลังส่งเข้าคอมพิวเตอร์...</span>';
                }

                const res = await BrailleSync.sendOCRResult(activeFullText, {
                    confidence: 95,
                    rawText: activeFullText
                });

                if (res && btn) {
                    btn.innerHTML = '<i class="fa-solid fa-circle-check"></i> <span>ส่งเข้าคอมพิวเตอร์สำเร็จแล้ว!</span>';
                    btn.style.background = '#00ff88';
                    setTimeout(() => {
                        btn.innerHTML = originalHtml;
                        btn.style.background = 'linear-gradient(135deg, #00f2fe, #00ff88)';
                    }, 2500);
                }
            }
        }

        // Initialize on DOM load
        window.addEventListener('DOMContentLoaded', () => {
            initSync();
            startLiveCamera();
        });
    </script>
</body>
</html>
