<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>BrailBox Scanner - Mobile Camera OCR</title>
    
    <!-- External Dependencies & Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            overflow: hidden !important;
            height: 100% !important;
            height: 100dvh !important;
            width: 100vw !important;
            margin: 0 !important;
            padding: 0 !important;
            background: #000000 !important;
            color: #ffffff !important;
            font-family: 'Prompt', sans-serif !important;
            touch-action: manipulation;
        }

        /* Full Screen Native Camera Root */
        .app-root {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        /* Camera Video Layer */
        .video-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        #cameraVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Viewfinder Frame (Guide overlay for text) */
        .viewfinder-guide {
            position: absolute;
            z-index: 5;
            width: min(88vw, 360px);
            height: min(56vh, 440px);
            border: 2px solid rgba(0, 242, 254, 0.6);
            border-radius: 20px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.52), 0 0 25px rgba(0, 242, 254, 0.25);
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 14px;
        }

        .viewfinder-guide-tag {
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid rgba(0, 242, 254, 0.4);
            color: #00f2fe;
            font-size: 12px;
            font-weight: 600;
            padding: 5px 14px;
            border-radius: 30px;
            align-self: center;
            backdrop-filter: blur(8px);
            letter-spacing: 0.5px;
        }

        .viewfinder-corner-acc {
            position: absolute;
            width: 24px;
            height: 24px;
            border: 3px solid #00ff88;
        }
        .corner-tl { top: -2px; left: -2px; border-right: none; border-bottom: none; border-top-left-radius: 20px; }
        .corner-tr { top: -2px; right: -2px; border-left: none; border-bottom: none; border-top-right-radius: 20px; }
        .corner-bl { bottom: -2px; left: -2px; border-right: none; border-top: none; border-bottom-left-radius: 20px; }
        .corner-br { bottom: -2px; right: -2px; border-left: none; border-top: none; border-bottom-right-radius: 20px; }

        /* Top Header Overlay */
        .top-nav-bar {
            position: relative;
            z-index: 20;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: max(14px, env(safe-area-inset-top, 14px)) 16px 12px 16px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.88) 0%, rgba(0, 0, 0, 0.4) 70%, transparent 100%);
        }

        .nav-circle-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 16px;
            backdrop-filter: blur(10px);
            cursor: pointer;
            transition: all 0.15s;
        }

        .nav-circle-btn:active {
            transform: scale(0.9);
            background: rgba(0, 242, 254, 0.3);
            color: #00f2fe;
        }

        /* Auto-Sync Status Pill */
        .auto-sync-status-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(0, 255, 136, 0.6);
            border-radius: 30px;
            padding: 7px 18px;
            font-size: 13px;
            font-weight: 700;
            color: #00ff88;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6), 0 0 14px rgba(0, 255, 136, 0.3);
            backdrop-filter: blur(12px);
        }

        .status-dot-pulse {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff88;
            box-shadow: 0 0 10px #00ff88;
            animation: dotGlow 1.5s infinite alternate;
        }

        @keyframes dotGlow {
            from { transform: scale(0.8); opacity: 0.6; }
            to { transform: scale(1.3); opacity: 1; }
        }

        /* Bottom Controls Bar */
        .bottom-nav-bar {
            position: relative;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 10px 20px max(24px, env(safe-area-inset-bottom, 24px)) 20px;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.6) 75%, transparent 100%);
        }

        .shutter-control-row {
            width: 100%;
            max-width: 360px;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        /* Primary Tactile Shutter Button */
        .btn-camera-shutter {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #ffffff;
            border: 4px solid rgba(0, 242, 254, 0.9);
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.7), inset 0 0 10px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-camera-shutter:active {
            transform: scale(0.86);
            background: #00f2fe;
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.95);
        }

        .shutter-inner-core {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00f2fe, #00ff88);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #022c22;
            font-size: 26px;
        }

        .aux-control-btn {
            background: rgba(255, 255, 255, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.15s;
        }

        .aux-control-btn:active {
            transform: scale(0.9);
            background: rgba(0, 242, 254, 0.3);
            color: #00f2fe;
        }

        .shutter-prompt-text {
            font-size: 13px;
            color: #e2e8f0;
            font-weight: 600;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Slide-up Result Bottom Sheet */
        .result-sheet-backdrop {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-height: 85dvh;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.98), rgba(8, 12, 22, 0.98));
            border-top: 1px solid rgba(0, 242, 254, 0.5);
            border-radius: 24px 24px 0 0;
            padding: 20px 18px max(24px, env(safe-area-inset-bottom, 24px)) 18px;
            z-index: 50;
            display: none;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.85), 0 0 30px rgba(0, 242, 254, 0.2);
            backdrop-filter: blur(20px);
            overflow-y: auto;
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .result-sheet-backdrop.active {
            display: flex;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .sheet-handle {
            width: 44px;
            height: 4px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 2px;
            align-self: center;
        }

        .result-preview-card {
            background: rgba(0, 242, 254, 0.06);
            border: 1px solid rgba(0, 242, 254, 0.25);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .result-text-value {
            font-size: 20px;
            font-weight: 700;
            color: #00ff88;
            line-height: 1.4;
            word-break: break-word;
        }

        .btn-mega-sync-pc {
            background: linear-gradient(135deg, #00f2fe, #00ff88);
            color: #022c22;
            border: none;
            border-radius: 16px;
            padding: 16px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 25px rgba(0, 255, 136, 0.45);
            transition: all 0.15s;
        }

        .btn-mega-sync-pc:active {
            transform: scale(0.97);
        }

        .btn-secondary-action {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #f8fafc;
            font-size: 14px;
            font-weight: 600;
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            transition: all 0.15s;
        }

        .btn-secondary-action:active {
            background: rgba(0, 242, 254, 0.15);
            color: #00f2fe;
        }

        .hidden-el {
            display: none !important;
        }
    </style>
</head>

                </div>

        </div>

        <!-- Bottom Controls Bar with Big Manual Shutter Button -->

            <div class="shutter-prompt-text">

            <div class="shutter-control-row">

                <button class="aux-control-btn" onclick="document.getElementById('fileInput').click()" title="เลือกรูปภาพจากเครื่อง">

                </button>

        </div>

        <!-- OCR Result Slide-Up Bottom Sheet -->
        <div class="result-sheet-backdrop" id="ocrResultSection">
            <div class="sheet-handle"></div>
            
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div style="font-size: 14px; font-weight: 700; color: #00f2fe; display: flex; align-items: center; gap: 6px;">
                    <i class="fa-solid fa-circle-check" style="color: #00ff88;"></i> อ่านข้อความสำเร็จ

                <button onclick="speakResult()" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; border-radius: 20px; padding: 4px 12px; font-size: 12px; cursor: pointer;">
                    <i class="fa-solid fa-volume-high"></i> ฟังเสียงอ่าน

            <div class="result-preview-card">

            <!-- Big Sync to PC Button -->

    <script>
        let currentFacingMode = 'environment';
        let activeFullText = '';
        let isCapturing = false;
        let isVoiceActive = true;

        function saveAndGoToIndex(e) {
            if (activeFullText && activeFullText.trim()) {
                try {
                    localStorage.setItem('braillend_last_ocr_text', activeFullText.trim());
                } catch (err) {}
            }
        }

        async function flipCameraFacingMode() {
            currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
            await startLiveCamera();
        }

        async function startLiveCamera() {
            stopCameraStream();
            const video = document.getElementById('cameraVideo');
            if (!video) return;

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { ideal: currentFacingMode },
                        width: { ideal: 1920, min: 640 },
                        height: { ideal: 1080, min: 480 }
                    },
                    audio: false
                });
                video.srcObject = stream;
                await video.play();
            } catch (err) {
                console.warn('[Camera Stream Warning]: Falling back to standard video stream', err);
                try {
                    const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    video.srcObject = fallbackStream;
                    await video.play();
                } catch (e2) {
                    console.error('[Camera Access Error]:', e2);
                }
            }
        }

        function stopCameraStream() {
            const video = document.getElementById('cameraVideo');
            if (video && video.srcObject) {
                const tracks = video.srcObject.getTracks();
                tracks.forEach(t => t.stop());
                video.srcObject = null;
            }
        }

        function toggleVoiceAudio() {
            isVoiceActive = !isVoiceActive;
            const icon = document.getElementById('voiceIcon');
            if (icon) {
                icon.className = isVoiceActive ? 'fa-solid fa-volume-high' : 'fa-solid fa-volume-xmark';
                icon.style.color = isVoiceActive ? '#00ff88' : '#64748b';
            }
        }

        // --- Manual Capture Photo Function ---
        async function captureAndProcess() {
            if (isCapturing) return;
            isCapturing = true;

            const video = document.getElementById('cameraVideo');
            let capturedDataUrl = '';

            if (video && (video.videoWidth > 0 || video.readyState >= 2)) {
                const w = video.videoWidth || 1080;
                const h = video.videoHeight || 1920;
                const offCanvas = document.createElement('canvas');
                offCanvas.width = w;
                offCanvas.height = h;
                offCanvas.getContext('2d').drawImage(video, 0, 0, w, h);
                capturedDataUrl = offCanvas.toDataURL('image/jpeg', 0.95);
            }

            if (capturedDataUrl) {
                runOcrOnCapture(capturedDataUrl);
            } else {
                // If live stream is blocked, open file picker immediately
                document.getElementById('fileInput').click();
                isCapturing = false;
            }
        }

        // Handle File / Gallery selection
        function handleFileSelected(event) {
            const file = event.target.files && event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const dataUrl = e.target.result;
                    runOcrOnCapture(dataUrl);
                };
                reader.readAsDataURL(file);
            }
        }

        // Run OCR with live progress status & auto-sync
        async function runOcrOnCapture(imageSrc) {
            const sheet = document.getElementById('ocrResultSection');
            const display = document.getElementById('detectedTextDisplay');
            if (sheet) sheet.classList.add('active');
            if (display) display.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังอ่านข้อความภาษาไทย (0%)...';

            try {
                let recognizedText = '';
                let confidence = 95;

                if (typeof Tesseract !== 'undefined') {
                    const ret = await Tesseract.recognize(imageSrc, 'tha+eng', {
                        logger: m => {
                            if (m && m.status && display) {
                                const pct = m.progress ? Math.round(m.progress * 100) : 0;
                                display.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> ${m.status === 'recognizing text' ? 'กำลังสแกนข้อความ' : 'กำลังเตรียมโมเดล'} (${pct}%)`;
                            }
                        }
                    });
                    recognizedText = ret.data.text ? ret.data.text.trim() : '';
                    confidence = ret.data.confidence ? Math.round(ret.data.confidence) : 90;
                }

                activeFullText = recognizedText || 'ไม่พบข้อความในภาพ (ลองถ่ายในที่สว่าง)';
                if (display) display.textContent = `"${activeFullText}"`;
                const confTag = document.getElementById('ocrConfidenceTag');
                if (confTag) confTag.textContent = `ความมั่นใจ: ${confidence}%`;

                // Auto speech if active
                if (isVoiceActive && activeFullText && activeFullText !== 'ไม่พบข้อความในภาพ (ลองถ่ายในที่สว่าง)') {
                    speakResult();
                }

                // Auto sync immediately to PC
                if (typeof BrailleSync !== 'undefined' && activeFullText) {
                    BrailleSync.sendOCRResult(activeFullText, { confidence: confidence, rawText: activeFullText });
                }

            } catch (err) {
                console.error('[OCR Execution Error]:', err);
                if (display) display.textContent = 'เกิดข้อผิดพลาดในการอ่านข้อความ';
            } finally {
                isCapturing = false;
            }
        }

        function resetToScanAgain() {
            const sheet = document.getElementById('ocrResultSection');
            if (sheet) sheet.classList.remove('active');
            activeFullText = '';
            isCapturing = false;
            startLiveCamera();
        }

        function speakResult() {
            if ('speechSynthesis' in window && activeFullText) {
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(activeFullText);
                utter.lang = 'th-TH';
                utter.rate = 0.95;
                window.speechSynthesis.speak(utter);
            }
        }

        async function syncActiveTextToPC() {
            if (!activeFullText || !activeFullText.trim()) {
                alert('ยังไม่มีข้อความจากการถ่ายภาพ/OCR');
                return;
            }

            if (typeof BrailleSync !== 'undefined') {
                const btn = document.getElementById('btnSyncToPc');
                const originalHtml = btn ? btn.innerHTML : '';
                if (btn) {
                    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>กำลังส่งเข้าคอมพิวเตอร์...</span>';
                }

                const res = await BrailleSync.sendOCRResult(activeFullText, {
                    confidence: 95,
                    rawText: activeFullText
                });

                if (res && btn) {
                    btn.innerHTML = '<i class="fa-solid fa-circle-check"></i> <span>ส่งเข้าคอมพิวเตอร์สำเร็จแล้ว!</span>';
                    btn.style.background = '#00ff88';
                    setTimeout(() => {
                        btn.innerHTML = originalHtml;
                        btn.style.background = 'linear-gradient(135deg, #00f2fe, #00ff88)';
                    }, 2500);
                }
            }
        }

        // Initialize on DOM load
        window.addEventListener('DOMContentLoaded', () => {
            if (typeof BrailleSync !== 'undefined') {
                BrailleSync.joinRoom();
            }
            startLiveCamera();
        });
    </script>
</body>
</html>
